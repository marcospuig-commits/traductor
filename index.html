<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traductor">
<title>Traductor ES → EN</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0b1020;color:#e8eefc;padding:env(safe-area-inset-top) 16px 24px;min-height:100vh}
h1{font-size:22px;text-align:center;margin:18px 0}
.swap{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:12px;font-weight:600}
.swap button{background:#1d2747;color:#7cc4ff;border:0;border-radius:20px;padding:6px 14px;font-size:18px}
textarea{width:100%;min-height:130px;border-radius:14px;border:1px solid #26314f;background:#131a33;color:#fff;font-size:18px;padding:14px;resize:vertical}
.out{min-height:130px;border-radius:14px;background:#10284a;padding:14px;font-size:20px;margin-top:12px;white-space:pre-wrap}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:600;background:#1d2747;color:#e8eefc}
.row .main{background:#2f7cf6}
.mic.on{background:#e5484d}
small{display:block;text-align:center;color:#6b7a99;margin-top:18px}
</style>
</head>
<body>
<h1>Traductor</h1>
<div class="swap"><span id="from">Español</span><button id="sw">⇄</button><span id="to">Inglés</span></div>
<textarea id="src" placeholder="Escribe o pulsa el micrófono…"></textarea>
<div class="row">
  <button class="mic" id="mic">🎤 Hablar</button>
  <button class="main" id="go">Traducir</button>
</div>
<div class="out" id="out"></div>
<div class="row">
  <button id="say">🔊 Escuchar</button>
  <button id="copy">📋 Copiar</button>
</div>
<small>Pulsa Compartir → «Añadir a pantalla de inicio»</small>
<script>
let a='es',b='en';
const $=id=>document.getElementById(id);
$('sw').onclick=()=>{[a,b]=[b,a];$('from').textContent=a=='es'?'Español':'Inglés';$('to').textContent=b=='es'?'Español':'Inglés';const t=$('out').textContent;if(t){$('src').value=t;$('out').textContent='';}};
async function translate(){
  const q=$('src').value.trim(); if(!q) return;
  $('out').textContent='…';
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+a+'&tl='+b+'&q='+encodeURIComponent(q));
    const j=await r.json(); $('out').textContent=j[0].map(x=>x[0]).join('');
  }catch(e){
    try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+a+'|'+b);
      const j=await r.json(); $('out').textContent=j.responseData.translatedText;}
    catch(e2){$('out').textContent='Sin conexión.';}
  }
}
$('go').onclick=translate;
$('say').onclick=()=>{const u=new SpeechSynthesisUtterance($('out').textContent);u.lang=b=='en'?'en-US':'es-ES';speechSynthesis.cancel();speechSynthesis.speak(u);};
$('copy').onclick=()=>navigator.clipboard.writeText($('out').textContent);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{
  if(!SR){alert('Usa el micrófono del teclado del iPhone.');return;}
  const r=new SR();r.lang=a=='es'?'es-ES':'en-US';r.interimResults=true;
  $('mic').classList.add('on');
  r.onresult=e=>{$('src').value=[...e.results].map(x=>x[0].transcript).join('');};
  r.onend=()=>{$('mic').classList.remove('on');translate();};
  r.start();
};
</script>
</body>
</html>
